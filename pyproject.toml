[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lis-yield-curve-reconstruction"
version = "0.1.0"
description = "LIS sovereign yield curve reconstruction and validation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2", "scipy>=1.10", "matplotlib>=3.7", "reportlab>=4", "svglib>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["yieldcurves*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
extend-exclude = ["notes/review_inputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
